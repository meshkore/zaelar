# Engine release trigger → runs a test gate on a version tag and, if green, notifies a downstream repo.
#
# Kept minimal and secret-free on purpose: it runs a pre-release test gate and, if green, sends a
# repository_dispatch for this tag to the repo named in CLOUD_REPO. It contains no deployment
# credentials and no deployment logic — whatever consumes the dispatch lives elsewhere.
#
# Pushing a version tag is the trigger —
#   git tag v2.78 && git push origin v2.78
# → this gate runs → on green, the dispatch is sent.
#
# PREREQUISITE: a repo secret CLOUD_DISPATCH_TOKEN — a fine-grained PAT scoped to ONLY the
# downstream repo with "contents: read" + "metadata: read" + permission to create a
# repository_dispatch. Set CLOUD_REPO below to that repo's full name once it exists.
#
# ALTERNATIVE (zero public footprint): instead of this file, a scheduled poller inside the downstream repo
# that watches this repo's tags. Cleaner boundary, ~poll-interval latency. Not used here because the
# tag→dispatch path is immediate and needs no "what's already deployed" bookkeeping. Ask to switch.

name: Release (tag → cloud deploy)

on:
  push:
    tags:
      - "v*"

env:
  CLOUD_REPO: asimovia/zaelar-cloud # ← set to the real private cloud repo name once created

jobs:
  gate-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history AND tags: the build-number gate below has to read `update/BUILD` as it stood at
        # the PREVIOUS release tag, and the default shallow checkout has neither.
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PRE-DEPLOY GATE. Today: a fast, reliable SYNTAX check across the tree (catches a broken commit
      # without needing the heavy runtime deps/models the full suite requires). EXTEND THIS with the
      # real unit/integration suite once the engine's CI deps are wired (pip install + a models-free
      # subset, or `tests/run_testmap.py --ci`). Kept honest: a weak-but-reliable gate beats a strong
      # one that false-fails and blocks releases. The deep safety net is the cloud pipeline's
      # post-deploy e2e smoke + auto-rollback.
      - name: Gate — syntax check
        # The list is the Dockerfile's COPY list: a package the image ships but the gate does not compile is a
        # syntax error that reaches production. `observability` and `i18n` were missing — both are imported at
        # module level by server/__init__.py, so either one would crash the boot the gate had just blessed.
        run: python -m compileall -q nucleo memory voice server widgets bus config connectors observability i18n update

      # GATE — THE BUILD NUMBER MOVED (V2-553). `update/BUILD` is the only version a person is ever shown,
      # and a release that ships the same number as the last one is invisible to the person it exists for:
      # their browser updates and the badge still reads what it read yesterday. Forgetting `python -m update
      # bump` is the single mistake this module cannot survive on its own, so it is refused at the door
      # rather than shipped silently. A first release with no previous tag to compare against passes.
      - name: Gate — the build number moved
        run: |
          set -uo pipefail
          NOW=$(tr -d '[:space:]' < update/BUILD)
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -1 || true)
          if [ -z "${PREV}" ]; then echo "no previous tag to compare — build ${NOW} accepted"; exit 0; fi
          OLD=$(git show "${PREV}:update/BUILD" 2>/dev/null | tr -d '[:space:]' || true)
          OLD=${OLD:-0}
          echo "build ${OLD} (${PREV})  ->  ${NOW} (${GITHUB_REF_NAME})"
          if [ "${NOW}" -le "${OLD}" ]; then
            echo "::error::update/BUILD did not move (${OLD} -> ${NOW}). Run 'python -m update bump', commit it, retag."
            exit 1
          fi

      - name: Dispatch deploy to the private cloud repo
        env:
          TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Gate green → asking $CLOUD_REPO to deploy engine tag $TAG"
          curl -sf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${CLOUD_REPO}/dispatches" \
            -d "{\"event_type\":\"engine-release\",\"client_payload\":{\"engine_ref\":\"${TAG}\"}}"
