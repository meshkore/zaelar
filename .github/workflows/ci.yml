# CI on every push and PR — the robot that runs the controls (V2-601 T-02).
#
# The 2026-09-05 audit's headline finding was not a missing control but a missing OPERATOR for them: the
# architecture ratchet had been RED on clean main for days and nobody saw, because the only workflow this repo
# had (release.yml) fires on tags. This job is deliberately small and reliable: the deterministic
# `tests/infrastructure` suite — which carries every ratchet (file-size ceilings, dependency directions,
# testmap registration, Docker COPY coverage, repo-root hygiene, roadmap closure) — plus a syntax sweep of the
# packages the image ships and the ruff F/E9 rules (the NameError-swallowed-by-fail-open class, paid twice:
# V2-348, V2-555).
#
# V2-778 F0 (2026-10-02): the destination reached — the gate now runs EVERY deterministic test, through the same
# hang-aware runner the operator uses (`tests/watchdog.py`: chunked, names a hung test, kills the process group,
# exits 1 on any red). Staging on `tests/infrastructure` had a cost nobody saw: the job never got past ruff in 60
# runs, and what the wide sweep caught (a non-hermetic suite, three real ratchets) never reached CI at all.
# What it needs from the runner is what a fresh clone lacks: Chromium for the browser contracts, node for the
# `.mjs` ones. The suite itself pins TZ, language, workspace and credentials (root `conftest.py`).

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: test_version and the roadmap-closure ratchet read git metadata.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Syntax sweep (the Dockerfile's COPY list — same as the release gate)
        run: python -m compileall -q nucleo memory voice server widgets bus config connectors observability i18n update

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Ruff — F + E9 only (no formatting; N agents share this tree)
        run: |
          pip install "ruff==0.14.0"
          ruff check .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Chromium for the browser contracts (the version the pinned playwright asks for)
        run: python -m playwright install --with-deps chromium

      - name: Deterministic sweep — every model-free test, hang-aware (tests/watchdog.py)
        env:
          # The suite is deterministic and network-free by contract; belt and braces for CI.
          ZAELAR_ATTENTION: always
        run: python tests/watchdog.py --report watchdog-report.json

      - name: Keep the sweep's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-report
          path: watchdog-report.json
          if-no-files-found: ignore
