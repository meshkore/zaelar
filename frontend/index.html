<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0f16" id="themeColorMeta"/>
<title>zaelar</title>
<script>
  /* SHELL PICKER (V2-124) — runs BEFORE a single ES module loads, so a phone never downloads the desktop shell's
     ~90 KB of layout CSS just to be redirected away from it. Three rules, in order:
       1. an explicit choice wins and STICKS  — ?desktop=1 / ?mobile=1 persist into localStorage;
       2. a stored choice wins over detection — the operator who picked desktop on a tablet keeps it forever;
       3. otherwise: narrow viewport AND a coarse pointer -> /m. BOTH conditions, deliberately: a narrow desktop
          window is still a mouse, and a 13" tablet with a trackpad is still a desktop. Getting this wrong in the
          permissive direction would strand a laptop user in a one-widget-at-a-time shell with no way back.
     `/` must keep answering 200 with HTML for Fly's health check, so the redirect happens in the CLIENT, never as
     an HTTP 302 from the server (server/pages.py). */
  (function () {
    try {
      var q = new URLSearchParams(location.search);
      if (q.has("desktop")) { localStorage.setItem("zaelar_shell", "desktop"); return; }
      if (q.has("mobile")) { localStorage.setItem("zaelar_shell", "mobile"); location.replace("/m"); return; }
      var pick = localStorage.getItem("zaelar_shell");
      if (pick === "desktop") return;
      if (pick === "mobile") { location.replace("/m"); return; }
      var narrow = Math.min(screen.width || innerWidth, innerWidth) <= 820;
      var coarse = matchMedia("(pointer: coarse)").matches;
      if (narrow && coarse) location.replace("/m");
    } catch (_) { /* no storage / no matchMedia: stay on the desktop shell, which always works */ }
  })();
</script>
<!-- palette.css FIRST and as its own <link> (V2-124): it holds the --hb-* color contract that BOTH shells and
     every widget read. A separate parallel request, not a CSS @import, so it does not serialize behind styles.css. -->
<link rel="stylesheet" href="/static/app/core/palette.css?v=1"/>
<link rel="stylesheet" href="/static/app/core/shared-surfaces.css?v=1"/>
<link rel="stylesheet" href="/static/app/styles.css?v=3"/>
<style>
  /* PREBOOT splash — deliberately inline in the HTML: paints on the FIRST byte, BEFORE ES modules load.
     On a cold account Machine, modules take tens of seconds; without this the user saw a BLACK screen
     until BootOverlay (the neural veil, painted by JS) mounted. Its sole purpose is to entertain from
     second 1. `main.js` removes it as soon as the app mounts. Zero dependency on /static (inline colors). */
  #preboot { position:fixed; inset:0; z-index:9998; display:flex; flex-direction:column; align-items:center;
             justify-content:center; gap:18px; background:#0a0f16; color:#e6e8ee;
             font:15px/1.5 -apple-system, system-ui, sans-serif; }
  #preboot .ring { width:46px; height:46px; border-radius:50%;
             background:conic-gradient(from 0deg, #10b981, #7ad0ff, #8b7bff, #10b981);
             -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
             mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
             animation:pbspin 1s linear infinite; }
  #preboot .lbl { opacity:.72; letter-spacing:.02em; }
  @keyframes pbspin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="preboot"><div class="ring"></div><div class="lbl">Starting up zaelar…</div></div>
<!-- The interface is built entirely by the ES-module app under /static/app/.
     index.html is just the bootstrap: styles + the vendored browser-VAD scripts
     (they attach window.vad / window.ort) + the module entry point. -->
<script src="/static/vad/ort.wasm.min.js"></script>
<script src="/static/vad/vad.bundle.min.js"></script>
<script type="module" src="/static/app/main.js?v=6"></script>
</body>
</html>
