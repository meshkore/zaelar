<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>zaelar — offline</title>
<!--
  The ONLY page the service worker ever serves from its cache. Fully self-contained (inline CSS, no /static
  reference, no font, no image): a page shown because the network is gone cannot depend on the network to render.
  It says what is true and what to do, and nothing else — no retry spinner that cannot succeed, no fake status.
-->
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px;
         background:#0a0f16; color:#e8edf5; font:16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         text-align:center; }
  .card { max-width:34ch; }
  .dot { width:52px; height:52px; margin:0 auto 22px; border-radius:50%; border:2px solid #232e3d;
         background:radial-gradient(circle at 40% 35%, #1b2530, #0d1622); }
  h1 { margin:0 0 10px; font-size:20px; font-weight:600; }
  p { margin:0 0 18px; color:#93a1b6; font-size:15px; }
  button { min-height:48px; padding:0 22px; border:none; border-radius:14px; background:#3D6FE0; color:#fff;
           font:600 15px inherit; }
</style>
</head>
<body>
<div class="card">
  <div class="dot"></div>
  <h1>zaelar is out of reach</h1>
  <p>This phone has no connection right now. Your agent keeps running — nothing was lost, and the conversation
     picks up where it stopped as soon as you are back online.</p>
  <button onclick="location.replace('/m')">Try again</button>
</div>
</body>
</html>
