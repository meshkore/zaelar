id: zaelar
name: zaelar
description: Voice-first personal assistant (STT→«Colmena» brain (nucleo/)→TTS over LiveKit WebRTC)
standard_version: 27
version: 2.76
operator: ricart
repo: meshkore/zaelar

modules:
  - id: voice
    path: voice/
    description: Voice engine (LiveKit Agents, INI-012) in voice/engine/ — AgentSession (streaming, turn-taking, VAD, barge-in, preemptive-gen), provider registry + profiles remote/local (STT voxtral/deepgram/whisper, TTS cartesia/kokoro, VAD silero, turn livekit), voices catalog. Runs EMBEDDED in the server process (AgentServer, job_executor_type=THREAD). LLM providers = nucleo (the «Colmena» FlashBrain, default) + baselines direct/local + raw vendors (voice/engine/llm/providers/{nucleo,direct,local,…}.py). Top level = brain-agnostic contract kept pure: tag_protocol, speech, brain_notes, proactive, prompt, health_state, llm_health, observer (SSE).
  # brains/ RETIRADO como módulo en V2-009 (entierro de Hermes) — sustituido por nucleo/ (cerebro propio). El
  # provider del cerebro es voice/engine/llm/providers/nucleo.py. connectors/meshkore/reasoner.py (el "cerebro
  # aparte" del canal de cluster) fue RETIRADO en V2-069 «una sola mente» (2026-07-25): el canal de cluster lo
  # conduce el MISMO motor del FlashBrain, en perfil UNTRUSTED (connectors/meshkore/brain.py → nucleo/flash/
  # cluster.py). NO quedan brains/hermes, brains/duo ni connectors/meshkore/reasoner.py.
  - id: frontend
    path: frontend/
    description: Voice interface as a self-contained ES-module app (no build) — reactive core, services (LiveKit client via session-lk.js + vendored SDK in vendor/, audio/SSE), components, widget desktop. Solid-migration-ready. index.html is a thin bootstrap.
  - id: server
    path: server/
    description: FastAPI app + routers + module entrypoint (python -m server). Runs the LiveKit agent worker EMBEDDED in-process. HTTP: livekit_api (token + connect config + session.js swap), voice_api (voices/settings/status/events SSE), widgets, pages.
  - id: widgets
    path: widgets/
    description: Full-stack widgets (data.py + widget.js per folder), generator, catalog, runtime. Two kinds in manifest.json — `passive` (default) and `backed` (INI-016): a backed widget declares an owner.py (async start/stop/handle) run under widgets/supervisor.py in the server lifespan (mailbox + restart-with-backoff + disable after N fails, all traced via voice/observer.py); owner is the SOLE writer of its data dir, the face READs + ENQUEUEs (server_api._route_backed); generic GET /widgets/{id}/asset/{name} serves binary media. First backed widget = `navegador` — a real web browser inside zaelar (headless Chromium via Playwright: navigates the public web, screenshots the viewport, mounts YouTube embeds; needs `python -m playwright install chromium`). Also includes the hand-built `mensajeria` widget (INI-015) — the UNIFIED messaging surface (WhatsApp + Telegram + future email) backed by connectors/messaging: a single flat list by urgency with per-platform badges, per-platform connection cards with inline QR, controlled by voice ([[msg.*]]) and click. Replaced the former `whatsapp` widget. **V2-008:** `mensajeria` is now a `backed` widget with a `"gate":"nucleo"` (owner.py) — under BRAIN=nucleo the supervisor starts its owner (subscribes to the bus `connector.msg`/`connector.status`, triages IN the widget with its internal triage_agent = LOCAL model, dumps content to memory, publishes `msg.mark_read`); under duo/hermes the gate skips the owner and the widget behaves as the passive one of before (connectors write the store directly). The gate is a general backend mechanism (any backed widget can require a brain mode).
  - id: config
    path: config/
    description: Runtime config MANAGED FROM THE UI (gitignored JSON the frontend writes; store wins over .env). settings.py/settings.json = ⚙ panel (STT/TTS/voice/language). connectors.py/connectors.json = connector enable flags + credentials (Telegram api_id/api_hash) entered in the messaging widget, with a redacted public view (secrets never returned to the frontend). v2.py/v2.json = model routing (FlashBrain fast + SlowBrain code_agent + memory embed/rerank/CORAZÓN, model POR INVOCACIÓN). **V2-040 (perfiles + wizard):** profiles.py = the PROFILE as a COORDINATED config bundle — one name (`local`|`cloud`, `remote`=alias) → the full default set across all three axes (voice engine + v2 routing + memory), applied in one `apply()` to the SAME stores the UI edits (override-per-component still wins → hybrids). doctor.py = the capability DETECTOR (`python -m config.doctor` / `make doctor` → .meshkore/logs/system-report.json): hardware (accel.detect), Ollama+models, claude/livekit/chromium binaries, optional deps, which credentials are set (presence only), recommended profile — read by the first-run web wizard. Product invariant: install once, then everything from the interface — no .env editing by end users (INI-015; see zaelar-conventions.md §Configuration is UI-managed).
  - id: connectors
    path: connectors/
    description: External service connectors. meshkore/ = native multi-cluster WebSocket I/O channel (a third input/output next to voice & chat), conducted by the SAME FlashBrain engine in an UNTRUSTED profile (V2-069 "una sola mente": brain.py → nucleo/flash/cluster.py, tools off by default, identity-safe system prompt) — a bridge (bridge.py) that injects cluster messages into the brain and routes [[cluster.*]] tags out, plus: capsule.py (V2-069, the per-relationship memory — phase saludo→sondeo→trabajo→cierre, objective set ONLY by the operator, stall/resource meters, V2-072 negotiated pact); evaluator.py (V2-075, an INDEPENDENT model judges conversation health/action — flowing/stuck/dead_end/imbalanced/off_track — replacing hardcoded pace regex); perms.py + store.py (V2-076, a PER-CLUSTER permission profile the operator grants at connect-time, deny-all by default, translated into a gated subset of the FlashBrain's own tool catalog — no duplicated tool surface); a security guard (security.py) that fences untrusted peer input against prompt injection, blocks/redacts secrets & identity leaks on the way out, and (V2-071) detects/guards against a peer offloading expensive work onto us. A permission-gated cluster CAN reach `escalate_to_slowbrain` (a real dev-worker, see nucleo/git_cli.py + nucleo/sandbox.py in the nucleo module) but ONLY if the operator has ALSO set an objective for that relationship (capsule.objective, fail-closed gate) — permission alone is not enough. Zero-permission clusters are byte-identical to the pre-V2-076 behavior. architect/ = Architect code/project provider — voice-driven remote control of the shared MeshKore daemon (list/create projects, async asks to each project's architect-master via [[architect.*]] tags; results return through proactive voice + [SISTEMA] brain notes; operator-only, token in .env). whatsapp/ = WhatsApp triage connector (INI-014, WIP) — VENDORED Baileys bridge from Hermes (connectors/whatsapp/bridge/, patched: mark-read endpoint + observe mode, update-safe vs `hermes update`) reads the operator's personal WhatsApp (QR-linked device); zaelar triages the stream with a LOCAL classifier (qwen2.5:3b via Ollama, nothing personal leaves the machine, remote fallback via WA_TRIAGE_MODEL), surfacing only what matters through proactive voice + [SISTEMA] notes and marking-read what was summarized. Classifier does NOT go through the Hermes agent (preserves the ACP voice invariant + privacy). Read-only + mark-read; auto-responder deferred (Fase 4). telegram/ = Telegram triage connector (INI-015) — a Telethon USERBOT (personal account, NOT the Bot API → it can read personal chats), linked by QR shown IN the canvas (generated with segno). Pure-Python in-process asyncio, NO Hermes dependency and NO vendored bridge ("black-box lib", unlike WhatsApp) — Hermes only ships the Bot API. Same read-only + mark-read (send_read_acknowledge) discipline. messaging/ = SHARED messaging layer both connectors build on: triage.py (the LOCAL platform-agnostic classifier, promoted from whatsapp — qwen2.5:3b via Ollama, nothing personal leaves the machine, remote fallback via MSG_TRIAGE_MODEL, never through the Hermes agent), store.py (the UNIFIED store widgets/_data/mensajeria.json — per-platform link state + one combined item list + a pending_read queue carrying each key's platform), notify.py (proactive voice + [SISTEMA] note, shared throttle), brief.py (the combined numbered brief the brain sees), and dispatch_tag ([[msg.*]] routes by item.platform). Both connectors write the unified store; the single `mensajeria` widget reads it. See .meshkore/docs/architecture/zaelar-hermes-federation.md. email/ = **Email connector (V2-051)** — the CLEANEST of the three: stdlib-only (imaplib/smtplib), NO Node bridge (WhatsApp) NOR third-party lib (Telegram). mailbox.py = pure IMAP/SMTP logic VENDORED+adapted from Hermes' email adapter (poll with UID dedup via BODY.PEEK — no \Seen on read; HTML→text; noreply/bulk filter; SPF/DKIM/DMARC verdict; SMTP reply with In-Reply-To/References threading), config.py (UI-managed store wins over .env; provider presets Gmail/Outlook/iCloud/Yahoo/otro), service.py (asyncio engine, IMAP/SMTP always via to_thread; publishes to the bus like WhatsApp/Telegram + drains msg.mark_read → IMAP \Seen + msg.reply → SMTP). Auth = IMAP/SMTP + app-password (V2-051). **V2-055 (email at max):** providers.py = single REGISTRY/list of email connectors (gmail/outlook/yahoo/icloud/generic-imap + auth_methods + OAuthSpec + domain deduction); oauth.py = OAuth2 auth-code + PKCE + token store (auto-refresh), DORMANT until app registered (Spotify pattern); transport = XOAUTH2 over IMAP/SMTP so Gmail AND Outlook reuse mailbox.py (Outlook is OAuth-ONLY — Microsoft killed basic-auth). Per-provider app registration + callback + widget sign-in UX = initiative V2-055. **RESPONDER (V2-051):** messaging gained OUTBOUND — a `pending_reply` queue in store + `msg.reply`/`ReplyInbox` bus seam + the `mensajeria` `reply` action (confirm:true) driven by the FlashBrain tool `reply_message` (function-calling; CONFIRM gate reads the draft & asks OK before SMTP send). Generic across channels (WhatsApp/Telegram to inherit). Auto-reply DEFERRED (flag OFF). Initiating a message to a NAMED contact who hasn't written = contacts subsystem (V2-052, design). Future slots inside the same widget: LinkedIn, X. **V2-041 (music):** music/ = the connector-AGNOSTIC music seam (base.py = the MusicProvider contract + Track/NowPlaying/MusicResult; registry.py = lazy provider registry, active() picks the first connected; __init__.py = the facade `control(action, query)` used by the FlashBrain tool `play_music` and — a SEPARATE future piece — a music widget that works with ANY streaming connector). spotify/ = first provider: Spotify Web API (client.py httpx REST for search + player control with NO_ACTIVE_DEVICE recovery) + auth.py (OAuth 2.0 Authorization Code + PKCE; client_id in the credential store, tokens in .meshkore/credentials/spotify.json chmod 600; the OAuth callback is served by server/spotify_api.py — no separate HTTP thread). Playback control needs Spotify Premium + an active device. music/youtube_audio.py = the FREE no-login fallback provider (resolves a song to a YouTube videoId via the Data API or a stdlib scrape and plays ONLY its audio, hidden, inside the `musica` widget — SEPARATE from the `youtube` video widget; the two never mix). The `musica` widget (widgets/musica/, passive, hand-built) is the surface: guided Spotify connect (like the mensajeria cards), a Spotify player when connected, and a hidden persisted YouTube-audio iframe otherwise. The FlashBrain drives it in-turn off the event loop (asyncio.to_thread, like web_search); "pon música" always plays something (free YouTube if no Spotify). **V2-008 (reshape STATELESS, gated BRAIN=nucleo):** ingest.py adds the bus seam — under nucleo the connectors STOP triaging/storing and only PUBLISH `connector.msg` (incoming, dedup by messageId) + `connector.status` (link+QR), and drain `msg.mark_read` (a MarkReadInbox per platform); triage+store move INTO the `mensajeria` widget owner (backed). triage.py/store.py/notify.py stay in place as the still-live duo/hermes path and as the classifier/store implementation the widget delegates to — their physical retirement is deferred to the entierro (V2-009), per strangler-fig. meshkore/ (cluster channel) is NOT part of the personal-message inbox (peers ≠ personal msgs; its stateless conversion, if wanted, belongs with the cluster-security work in V2-010).
  # files/ RETIRADO como módulo en V2-003 — plegado en la capa episódica de memory/ (bytes en el data-dir de la
  # memoria + resumen buscable; el upload vive en memory/server_api.py; files/ queda como shim de compatibilidad).
  - id: harness
    path: tests/agent_headless/harness/
    description: Evaluation harness with persona-based test runs (text-level bot-vs-bot + judge)
  - id: tester
    path: tests/voice/e2e/agent/
    description: Voice tester (INI-013) — a 2nd LiveKit participant that SPEAKS to zaelar (TTS) and LISTENS (STT), driving scenarios with a DeepSeek brain to detect things to improve (latency/turns/memory/agenda/widgets/robustness). Reuses the persona/judge/analyze/report logic of the prior sim candidate; transport is native LiveKit. Runnable/observable without a human mic. Dedicated key TESTER_AIMLAPI_KEY (never committed).
  # --- v2 «Colmena» (EPIC-v2-colmena; bus CONSTRUIDO + nucleo esqueleto en V2-001, resto V2-002→V2-010) ---
  - id: bus
    path: bus/
    description: (v2 · CONSTRUIDO V2-001) Sistema Nervioso — pub/sub de señales in-process (asyncio, generalización de voice/observer.py) con patrones fnmatch + emit_sync loop-agnóstico (call_soon_threadsafe, entrega cross-loop job-thread↔uvicorn). bus/log.py = log durable de eventos en SQLite (zaelar.db, tabla events, WAL) enganchado como sink. bus/sse.py = puente SSE al frontend: voice/observer.py re-expresado como suscriptor del topic `observer` (GET /events idéntico). Transporte HÍBRIDO (llamadas directas en la ruta caliente de voz + eventos para lo async/fan-out). NADA de Kafka/broker.
  - id: nucleo
    path: nucleo/
    description: (v2 · CONSTRUIDO V2-004→V2-008; **cerebro por defecto tras el entierro de Hermes, V2-009 · BRAIN=nucleo**) Cerebro propio de dos velocidades que SUSTITUYE a brains/ (Hermes retirado). FlashBrain (nucleo/flash/ — código propio reflejo, sub-segundo: router + cliente de modelo rápido con modelo POR INVOCACIÓN + gestor de frontend/widgets + lanzador de procesos + escalado; enchufado al motor de voz como provider livekit.agents.llm.LLM, cron.create/cancel → nucleo/scheduler). BÚSQUEDA WEB COMPARTIDA (nucleo/websearch.py, V2-022): primitivo propio model-agnóstico usado por AMBOS cerebros — el FlashBrain por la tool web_search (dato directo + síntesis, resuelto EN el turno, off-hot-path vía asyncio.to_thread) y el SlowBrain por WebSearch/WebFetch nativos del CodeAgent (dispatch._tools_for) para informes con datos actuales; proveedor POR CAPAS calidad-primero (respuesta-IA Perplexity/Tavily → snippets Brave → gratis DuckDuckGo, auto-upgrade por key); NAVEGAR un marketplace (Amazon/Wallapop) es otra cosa = el navegador (automate_web). Loop orquestador (nucleo/loop.py ~1 Hz + nucleo/scheduler.py cron PROPIO respaldado por memory.journal + nucleo/cron_api.py = /api/cron del panel ⏰ + nucleo/sparks.py chispas doble-gate: tareas programadas + chispas + dispara el consolidador off-hot-path + reporta por voz+UI; SUSTITUYE al cron nativo de Hermes; montado en el lifespan con BRAIN=nucleo). SlowBrain (nucleo/agentes/ — interfaz CodeAgent + adaptador Claude Code headless `claude -p` + adaptador Codex + factoría get_agent() por config; nucleo/memory_agent.py ★ = agente de MEMORIA, único escritor a memory/, compone contexto mínimo por heurística+router LLM barato; nucleo/mem_processor.py ★ = el CORAZÓN de escritura (V2-013): LLM LOCAL qwen2.5:3b que DESTILA cada turno del operador en PÍLDORAS curadas (dato canónico + metadatos) y decide DESCARTAR/ESTADO/CORTO/LARGO + importancia dinámica + slot, off-hot-path, fail-open a la heurística de memory_agent; nucleo/dispatch.py = dispatcher que compone prompt dinámico [contexto+tarea] → CodeAgent con modelo por invocación, consume escalate.requested del bus y entrega por voz+UI). Endurecimiento (deny-tools para input no confiable hacia el CodeAgent) = V2-010. **BRAIN WORKERS INTERACTIVOS (V2-038):** el SlowBrain one-shot se convierte en sesiones de trabajo VIVAS, bidireccionales y AGNÓSTICAS del motor — nucleo/workers/ (WorkerBackend/WorkerEvent/WorkerSpec + backends claude_session [stream-json], generator_session [widgets, conserva contrato], codex_session [stub]; registry.get_backend por config). dispatch.py se reescribe como GESTOR de sesiones (registro RAM único = fuente de verdad, kill de grupo, cola de inyección, resolve). Comunicación: bus worker.* + plano request/response nucleo/worker_api.py (/api/worker/act, política ALLOW/CONFIRM/DENY, piggyback de inyecciones, token por-tarea) + puentes nucleo/worker_bridge.py (hbask/hbact/hbsay). El FlashBrain dirige workers con send_to_worker (↓ inyectar refinamiento), stop_worker (matar), answer_worker (responder un ask); el loop supervisa (encallamiento/timeout/relato de asks). Diseño: initiatives/V2-038-brain-workers-interactivos.md. **V2-042 (RAILS):** rails.py = comportamientos comunes CONDUCIDOS — registro RAM de runs vivos proyectado a state.rails (qué se busca/suena, fallos AISLADOS sin_resolver con intentos+TTL reanudables al aportar datos) + guía situacional por rail inyectada al prompt SOLO con run vivo (prompt._rails_directive) + evento `rail` en /debug; cadena resolver→validar→actuar EN CÓDIGO por dominio (1ª: flash/music_flow.py — música difusa: intento directo → websearch con el Chromium caliente → extraer 'Artista - Título' con el modelo del turno → reintento → writeback ingest_message(source="music") → gustos/historial). Los widgets son el rail FUNDACIONAL (maquinaria propia V2-017/025/026; unificación taxonómica, no refactor). **V2-053 («Susurro»):** nucleo/susurro/ = auto-auditoría conversacional off-hot-path — se enchufa SOLO por el bus (topic semántico `turn.completed` emitido por observer.turn_detail [punto único voz+probe] + señales de fricción: queja/corrección del operador [detector determinista es/en], petición repetida, turno degradado `alert`, rail `sin_resolver`, worker.stuck/budget_kill); compone una ventana comprimida (conversación verbatim de memory.recent_window + decisiones por turno + eventos filtrados + ESTADO) y llama a un modelo POTENTE configurable (config §susurro por la UI; FUERA del camino de voz → puede razonar); devuelve correcciones de un CATÁLOGO CERRADO — F1: repair_say (→brain_notes [SISTEMA], hablada en el turno siguiente; el probe también drena) + finding (→.meshkore/logs/susurro/findings.jsonl con dedup + topic `susurro.finding`, lo consume el bucle de desarrollo test→fix); observabilidad TOTAL (eventos kind `susurro`: trigger/request CON payload/response CRUDA/apply con antes-después/completa); kill-switch de 1ª clase (ZAELAR_SUSURRO + susurro.enabled); INVARIANTE: NUNCA modifica BRAIN RULES/prompt de sistema en runtime — la genética solo cambia por desarrollo (findings→git). F2 (worker_action, re-ruteo determinista a un worker cuando el rápido dejó una acción real sin ejecutar) tiene un circuit breaker anti-bucle (nucleo/susurro/apply.py, máx 3 escaladas/10min, auditoría 2026-07-26 tras un incidente de saturación); F3 (state_patch/memory_fix) en la iniciativa V2-053. **V2-070 (Homeostasis):** nucleo/homeostasis.py = LATIDO AUTÓNOMO, tercer nivel HERMANO del cerebro (no piensa, cero LLM, determinista): recicla el motor LiveKit embebido cuando se detecta degradado y es seguro, rota logs, evicta cápsulas de cluster muertas; kill-switch ZAELAR_HOMEOSTASIS. **V2-076 (dev brainworker + sandbox + permisos por-cluster):** nucleo/git_cli.py = puente git ACOTADO (clone/commit/push, solo al repo que el operador autorizó por cluster, re-verifica el origin real en cada operación); nucleo/sandbox.py = aislamiento ligero de subproceso (cwd dedicado, rlimits, env acotado; NO wireado aún al proceso interactivo del dev-worker — ver zaelar-security.md); un `kind` de worker "dev" en nucleo/dispatch.py (Read/Write/Edit + Bash SOLO a git_cli, cwd temporal, gate operator-only vía connectors/meshkore/perms.py). El canal de cluster (untrusted) NUNCA dispara el dev-worker directo: requiere permiso 'code' concedido por el operador AL CONECTAR (connectors/meshkore/store.py) Y un objetivo fijado por el operador para esa relación (capsule.objective, guard fail-closed añadido en la auditoría 2026-07-26 — sin objetivo, dev-worker queda inerte aunque el permiso esté concedido).
  - id: memory
    path: memory/
    description: (v2 · NÚCLEO CONSTRUIDO en V2-002; INTEGRADA en V2-003; CORAZÓN DE ESCRITURA en V2-013) Memoria central tipo humana, 100% local, un solo fichero SQLite zaelar.db (WAL, en memory/_data/) — substrato compartido que escriben FlashBrain, el agente de memoria y los widgets, y lee el retriever en la ruta caliente (ms). REGLA DE ORO (V2-013): LLM al ESCRIBIR (off-hot-path, el CORAZÓN nucleo/mem_processor.py = qwen2.5:3b local que DESTILA píldoras + decide dónde/importancia/slot), queries DIRECTAS al LEER (sin LLM: state µs + recent_short entero + query RRF off-loop). Cada recuerdo es una PÍLDORA = dato canónico (text) + metadatos (schema v2: slot=clave canónica del hecho singular → supersede/dedup EXACTO; meta=JSON libre). Módulos: db/schema (tablas state·memories[+slot·meta]·vec_memories·fts_memories·edges·episodic·journal; SCHEMA_VERSION=2, migración ALTER idempotente) · queue+writer (único escritor, embeddings al insertar) · embeddings (embeddinggemma 768 vía Ollama, fallback fastembed, degradación determinista) · retriever (sqlite-vec vector + FTS5 keyword → RRF k=60 → score α·rel+β·rec+γ·imp+δ·uso → graph_expand) · state (tabla fija, µs) · graph (aristas) · consolidator (decay Ebbinghaus + dedup + eviction por peso, pinned intocable) · episodic (resumen buscable + carga lazy) · api (fachada + señal memory.updated por el bus). V2-003: ABSORBE el antiguo files/ como capa EPISÓDICA — los bytes pasan al data-dir de la memoria, POST /api/files/upload (ahora memory/server_api.py) llama a memory.write_episode (binario + resumen buscable, carga lazy; se retiró la nota [SISTEMA] de ruta); migración perezosa/idempotente/no-destructiva de files/uploads/ (memory.migrate_inbox en el lifespan); seed_from_hermes.py siembra el perfil del operador desde ~/.hermes (best-effort, solo-lectura); y los widgets escriben lo durable (mensajeria vuelca los mensajes entrantes como kind='msg'). El consumidor de la cola arranca en el lifespan (ZAELAR_MEMORY, def 1). Diseño en .meshkore/docs/architecture/zaelar-memory.md.

admission:
  # 2026-07-16: el operador derogó "no push sin confirmación" — CLAUDE.md §Hard rules manda commitear Y pushear
  # SIEMPRE en cuanto un incremento está listo (nunca pull/merge/reset/checkout para traer remoto; el árbol local
  # manda). Este flag se actualizó en la auditoría 2026-07-26 — estaba desalineado con esa política desde entonces.
  require_operator_approval_for_push: false
  no_reasoning_models_on_voice_path: true
  no_two_speed_brain_without_go_ahead: true
  never_commit:
    - .env
    - config/settings.json
    - config/connectors.json
    - config/v2.json
    - "~/.hermes/memories/USER.md"   # perfil personal que la memoria v2 puede sembrar (best-effort, solo-lectura)
    - .venv/
    - logs/

# Standard v7 §10.4 — Daemon self-update. Written automatically by
# the v7+ daemon on first boot. Set auto_update: false to require
# explicit confirmation for every version update via the V47 modal.
daemon:
  auto_update: true
  auto_update_source: https://architect.meshkore.com/reference/cluster/scripts/daemon.py
