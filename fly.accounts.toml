# Fly.io — Zaelar ACCOUNTS app (2026-08-09, unifying demo↔account into one system — operator ask).
# Separate app from `zaelar-demo` ON PURPOSE (operator decision, same session): mixing ephemeral demo
# Machines and persistent account Machines under one app risks repeating the 2026-08-05 stale-image
# incident (fly.js::currentAppImage() picking an old-image ephemeral machine over the freshly
# redeployed base) and complicates the reaper's Machine-state bookkeeping. Same engine image either
# way — public OSS, zero multi-tenancy awareness (boundary rule); only the app/env/volume differ.
#
# This file only matters for the INITIAL `flyctl deploy` (creates the app's base machine + pushes the
# image to the registry, so fly.js::currentAppImage() has something to resolve). Real per-ACCOUNT
# Machines are created dynamically by cloud/control-plane/ via the Fly Machines API
# (accountMachineConfig — auto_destroy:false, a mounted Volume, ZAELAR_USER_ID set), NOT through this
# file — see cloud/provisioner/src/machineConfig.js.
app = "zaelar-accounts"
primary_region = "iad"   # same region as zaelar-demo

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DEPLOY_ENV = "fly·iad·accounts"
  # Same provider wiring as fly.demo.toml / machineConfig.js's BASE_PROVIDER_ENV — MUST stay in sync
  # by hand (two deployables, no shared build step).
  ZAELAR_TTS = "elevenlabs"
  # FlashBrain = deepseek-v4-flash vía AIMLAPI. Es el único que enruta 12/12 (benchmarks §9); grok queda VETADO por
  # mis-rutear («conversaciones absurdas»). Requiere el secret AIMLAPI_KEY del app zaelar-accounts (puesto
  # 2026-08-13).
  # ⚠️ Esto YA NO es una copia de `config/v2.json` local (lo era el 2026-08-13; la nota vieja lo llamaba «fuente de
  # verdad»): desde el 2026-08-19 el titular local es `deepseek-v4-pro` DIRECTO por `api.deepseek.com`, y aquí NO se
  # puede seguir porque `DEEPSEEK_API_KEY` no está entre los secrets de este app. La divergencia es DELIBERADA, no
  # deriva — y estas tres env vars son lo que la sostiene: sin `config/v2.json` en la Machine (es per-máquina y
  # gitignored), el store queda vacío y manda el env (`config/v2.py::get`: defaults → store → env). Si algún día se
  # pone el secret de DeepSeek en este app, esto se puede alinear; hasta entonces, alinearlo a mano deja al cerebro
  # de voz apuntando a un endpoint sin credencial en CADA Machine de cuenta.
  FAST_PROVIDER = "deepseek"
  FAST_BASE_URL = "https://api.deepseek.com"
  FAST_MODEL = "deepseek-v4-pro"
  # Arranque en FRÍO barato: las Machines de cuenta AUTOSTOPan (min_machines_running=0) para no gastar, así que CADA
  # sesión paga el boot. El reranker de memoria (jina ~1.1GB) lo domina (2min18s→58s al apagarlo, medido en la demo).
  # Un usuario nuevo casi no tiene memoria → el reranker apenas aporta al principio, así que OFF en la nube (sin warm
  # pool, decisión del operador 2026-08-13). Reversible: enciéndelo cuando los usuarios acumulen memoria grande.
  MEMORY_RERANK = "off"
  ZAELAR_STT = "deepgram"
  CODE_AGENT_BASE_URL = "https://api.z.ai/api/anthropic"
  CODE_AGENT_MODEL = "glm-5.3"
  MEM_PROCESSOR_URL = "https://api.deepseek.com"
  MEM_PROCESSOR_MODEL = "deepseek-v4-flash"
  # Embeddings de la memoria (V2-501). El backend por defecto del motor era Ollama, que dentro de un contenedor
  # NO EXISTE: la Machine caía a fastembed —un modelo solo-inglés que sobre castellano acierta 7 de 12 donde
  # este hace 12— y nada lo decía en rojo. Se piden 768 dims para que la tabla vectorial sea la de siempre.
  ZAELAR_EMBED_BACKEND = "openai"
  ZAELAR_EMBED_MODEL = "text-embedding-3-small"
  ZAELAR_EMBED_BASE_URL = "https://api.openai.com/v1"
  # NB: unlike fly.demo.toml, deliberately NO MEMORY_RERANK=off, NO ZAELAR_DEMO_* — a real account
  # keeps the memory reranker ON (quality over ephemeral boot speed) and has no demo turn/TTL caps
  # (see accountMachineConfig's docstring: bounded by Energy balance instead).
  #
  # ROUTER MODE (2026-08-09, mirrors fly.demo.toml's ZAELAR_DEMO_ROUTER): this base Machine has no
  # account identity of its own (no ZAELAR_USER_ID), so WITHOUT this flag
  # nucleo/account_routing.py's middleware would no-op here and silently serve its OWN generic
  # content for a cookie meant for a different account's Machine — found live while testing Fase 2.
  # With it, this Machine still never binds an account as its own, but it DOES attempt to resolve +
  # fly-replay a request it isn't the right target for.
  ZAELAR_ACCOUNT_ROUTER = "1"
  # CONTROL_PLANE_URL — needed for THIS base Machine to resolve a zaelar_cloud_session cookie via
  # POST /session/verify (account_routing.py). Real account Machines get this from
  # accountMachineConfig instead; the base Machine needs its own copy since it's brought up by
  # `flyctl deploy`, not by the control-plane's provisioning path.
  CONTROL_PLANE_URL = "https://zaelar-control-plane.rjj.workers.dev"

# Same single coherent 443 service definition as fly.demo.toml, for the same cert-conflict reason —
# but WITH autostop/autostart (accountMachineConfig's ACCOUNT_SERVICES mirrors this for the
# per-account Machines the Machines API creates; this block covers only this app's own base machine).
[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
